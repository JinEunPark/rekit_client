services:
  web:
    # Deploy 파이프라인이 IMAGE_TAG 로 배포할 git 태그(X.Y.Z)를 주입한다. 롤백은 이전 태그 지정.
    image: 127.0.0.1:5000/rekit-client:${IMAGE_TAG:-latest}
    container_name: rekle-web
    restart: unless-stopped
    # 호스트 포트 미노출 — rekit/nginx가 rekit_edge 네트워크로 컨테이너명(rekle-web) 접근
    networks:
      - rekit_edge

networks:
  rekit_edge:
    external: true
