server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # vue-router history mode — 딥링크 새로고침 시 404 방지
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
