server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # vue-router history mode — 딥링크 새로고침 시 404 방지
    # $uri.html: SEO 프리렌더 산출물(scripts/prerender.mjs → dist/about.html 등)을
    # 트레일링 슬래시 리다이렉트 없이 직접 서빙 → canonical/sitemap URL과 일치.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;

        # HTML(및 favicon·robots·sitemap 등)은 캐시하지 않는다.
        # 안 그러면 브라우저 휴리스틱 캐시 때문에 배포 직후에도 구버전
        # index.html 이 남아 옛 해시 청크를 계속 물고 있어 변경이 반영 안 됨.
        # 해시된 /assets/* 는 아래 location 에서 별도로 장기 캐시.
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
